name: Pubblica il sito su GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Installa le dipendenze
        run: npm ci
      - name: Compila il sito
        run: npm run build -- --base=/armature/
      - name: Carica i file compilati
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
